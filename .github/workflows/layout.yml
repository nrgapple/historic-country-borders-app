name: Layout

# Safe-area (iPhone insets), responsive widths and forced-dark suites from
# playwright.layout.config.ts, run against the production build.
# A report, not a deploy gate. It lives apart from CI on purpose: CI runs on
# main queue per ref and never cancel, so a stuck layout shard there would
# delay the next push's deploy. Here every new push to the same ref cancels
# the run in progress.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    # The map renders in software on CI runners (~13 s a test), so the 351
    # tests are split across six parallel shards (Actions minutes are free
    # for this public repository).
    name: layout (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers and their system packages come preinstalled; the tag must
    # match @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Serve the build
        run: |
          node scripts/serve.mjs dist 4410 > serve.log 2>&1 &
          for _ in $(seq 1 30); do
            node -e "fetch('http://127.0.0.1:4410/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))" && exit 0
            sleep 1
          done
          cat serve.log
          exit 1
      - run: yarn test:layout --shard=${{ matrix.shard }}/6
        env:
          BASE_URL: http://127.0.0.1:4410
      - name: Upload layout-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

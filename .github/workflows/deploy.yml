name: Deploy

# Production deploys happen only from main, after CI has passed for that exact
# commit. A manual dispatch can redeploy the current main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://historicborders.app' }}
    env:
      # Optional Google Analytics ID, baked into the static bundle.
      PUBLIC_GA_FOUR: ${{ vars.NEXT_PUBLIC_GA_FOUR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Check deploy configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          exit $missing
      # Production serves the Astro remaster (remaster/dist). No Mapbox.
      - run: yarn remaster:build
      - run: node scripts/validate-remaster-dist.js
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn wrangler deploy --message "main ${GITHUB_SHA::7}"
      - name: Static production smoke test
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://historic-borders.champtoday.workers.dev' }}
        # New assets can take a few seconds to reach every Cloudflare edge.
        run: |
          for attempt in 1 2 3 4; do
            yarn smoke:production && exit 0
            echo "Smoke attempt $attempt failed; retrying in 15 s"
            sleep 15
          done
          exit 1

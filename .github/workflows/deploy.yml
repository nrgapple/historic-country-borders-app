name: Deploy

# Manual redeploy of the current main (rebuilds from source). Ordinary
# deploys run in CI's deploy job right after the app job passes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://historicborders.app' }}
    env:
      # Optional Google Analytics ID, baked into the static bundle.
      PUBLIC_GA_FOUR: ${{ vars.NEXT_PUBLIC_GA_FOUR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Check deploy configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          exit $missing
      # Production serves the Astro build (dist/). No Mapbox.
      - run: yarn build
      - run: yarn dist:validate
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn wrangler deploy --message "main ${GITHUB_SHA::7}"
      - name: Static production smoke test
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://historic-borders.champtoday.workers.dev' }}
        # New assets can take a few seconds to reach every Cloudflare edge.
        run: |
          for attempt in 1 2 3 4; do
            yarn smoke:production && exit 0
            echo "Smoke attempt $attempt failed; retrying in 15 s"
            sleep 15
          done
          exit 1

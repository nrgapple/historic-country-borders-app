name: Preview

# Deploys the latest same-repository pull request to the separate, static-only
# `historic-borders-preview` Worker (wrangler.preview.toml). Production is
# never touched.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One shared preview Worker: the newest PR build wins.
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Skip when Cloudflare is not configured
        id: configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Preview skipped: CLOUDFLARE_API_TOKEN is not set."
          fi
      - if: steps.configured.outputs.ok == 'true'
        run: yarn remaster:build
      - if: steps.configured.outputs.ok == 'true'
        run: node scripts/validate-remaster-dist.js
      - name: Deploy preview Worker
        if: steps.configured.outputs.ok == 'true'
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          yarn -s wrangler deploy --config wrangler.preview.toml \
            --message "PR #${{ github.event.pull_request.number }} ${GITHUB_SHA::7}" | tee upload.log
          url=$(grep -Eo 'https://historic-borders-preview\.[^ ]*workers\.dev' upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        if: steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="Preview for \`${GITHUB_SHA::7}\`: $URL/year/1492"
          gh pr comment "$PR" --edit-last --body "$body" 2>/dev/null \
            || gh pr comment "$PR" --body "$body"

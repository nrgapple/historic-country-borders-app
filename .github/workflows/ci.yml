name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests cancel superseded runs. Pushes to main never cancel, so a
# deploy that has started always finishes; the next push deploys after it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Reviewed exceptions. Keep each one narrow, justified, and dated.
          # GHSA-fc5q-39xc-vjpf (picomatch ReDoS, 2026-11): no patched release
          # exists for any version. It is reached only through build/lint
          # tooling (micromatch, typescript-eslint) matching globs written in
          # this repository, never user input. Remove once a fix ships.
          allow-ghsas: GHSA-fc5q-39xc-vjpf

  checks:
    # Formatting and offline validation of every committed data artifact.
    # A report, not a deploy gate.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn format:check
      - run: yarn data:validate

  app:
    # The production app (Astro + MapLibre). Its tested build is the
    # artifact the deploy job ships.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      # Optional Google Analytics ID, baked into the static bundle.
      PUBLIC_GA_FOUR: ${{ vars.NEXT_PUBLIC_GA_FOUR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn dist:validate
      - run: yarn cloudflare:check
      - run: yarn size:check
      - name: Keep the build for the e2e and deploy jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - run: yarn type-check
      # App, data-script and Worker unit tests (vitest.config.ts projects).
      - run: yarn test

  e2e:
    # Browser journeys against the app job's build, inside Microsoft's
    # Playwright image: browsers and their system packages are preinstalled,
    # so there is no `playwright install --with-deps` (its apt step hung for
    # 8-30 minutes three times on 2026-11-18). The image tag must match
    # @playwright/test in package.json.
    needs: [app]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: yarn test:e2e
      - name: Upload browser-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    # Production: ships the app job's tested build as soon as it and the
    # browser journeys pass.
    # It does not wait for `checks` (reported separately) and the layout
    # suites run in their own workflow (layout.yml), so neither can hold a
    # release. Rebuilding here would add minutes for nothing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [app, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://historicborders.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: yarn dist:validate
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn wrangler deploy --message "main ${GITHUB_SHA::7}"
      - name: Static production smoke test
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://historic-borders.champtoday.workers.dev' }}
        # New assets can take a few seconds to reach every Cloudflare edge.
        run: |
          for attempt in 1 2 3 4; do
            yarn smoke:production && exit 0
            echo "Smoke attempt $attempt failed; retrying in 15 s"
            sleep 15
          done
          exit 1

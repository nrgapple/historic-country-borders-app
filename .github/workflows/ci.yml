name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Reviewed exceptions. Keep each one narrow, justified, and dated.
          # GHSA-fc5q-39xc-vjpf (picomatch ReDoS, 2026-11): no patched release
          # exists for any version. It is reached only through build/lint
          # tooling (micromatch, typescript-eslint) matching globs written in
          # this repository, never user input. Remove once a fix ships.
          allow-ghsas: GHSA-fc5q-39xc-vjpf

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # A non-secret placeholder is sufficient because E2E intercepts Mapbox.
      NEXT_PUBLIC_MAPBOX_TOKEN: test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn quality
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
      - run: yarn playwright install --with-deps chromium firefox webkit
      - run: yarn test:e2e:run
      - name: Upload browser-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  layout:
    # Safe-area (iPhone insets), responsive widths and forced-dark suites from
    # playwright.layout.config.ts. Kept separate so the main validate job stays fast.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_MAPBOX_TOKEN: test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn playwright install --with-deps chromium webkit
      - run: yarn test:layout
      - name: Upload layout-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  remaster:
    # The Astro + MapLibre remaster in remaster/ (not deployed until the P4 cutover).
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn remaster:build
      - run: yarn remaster:type-check
      - run: yarn remaster:test
      - run: yarn --cwd remaster playwright install --with-deps chromium firefox webkit
      - run: yarn remaster:test:e2e
      - name: Upload remaster browser-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remaster-playwright-report
          path: |
            remaster/playwright-report/
            remaster/test-results/
          if-no-files-found: ignore
          retention-days: 7

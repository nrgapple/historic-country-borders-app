name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests cancel superseded runs. Pushes to main never cancel, so a
# deploy that has started always finishes; the next push deploys after it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Reviewed exceptions. Keep each one narrow, justified, and dated.
          # GHSA-fc5q-39xc-vjpf (picomatch ReDoS, 2026-11): no patched release
          # exists for any version. It is reached only through build/lint
          # tooling (micromatch, typescript-eslint) matching globs written in
          # this repository, never user input. Remove once a fix ships.
          allow-ghsas: GHSA-fc5q-39xc-vjpf

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # A non-secret placeholder is sufficient because E2E intercepts Mapbox.
      NEXT_PUBLIC_MAPBOX_TOKEN: test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn quality
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
      - run: yarn playwright install --with-deps chromium firefox webkit
      - run: yarn test:e2e:run
      - name: Upload browser-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  layout:
    # Safe-area (iPhone insets), responsive widths and forced-dark suites from
    # playwright.layout.config.ts, run against the production remaster build.
    # A report, not a deploy gate: the deploy job does not wait for it.
    # The map renders in software on CI runners (~13 s a test), so the 351
    # tests are split across six parallel shards (Actions minutes are free
    # for this public repository).
    name: layout (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn remaster:build
      - run: yarn playwright install --with-deps chromium webkit
      - name: Serve the remaster build
        run: |
          node remaster/scripts/serve.mjs remaster/dist 4410 > serve.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:4410/ > /dev/null && exit 0
            sleep 1
          done
          cat serve.log
          exit 1
      - run: yarn test:layout --shard=${{ matrix.shard }}/6
        env:
          BASE_URL: http://127.0.0.1:4410
      - name: Upload layout-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  remaster:
    # The production app (Astro + MapLibre, remaster/). Its tested build is
    # the artifact the deploy job ships.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      # Optional Google Analytics ID, baked into the static bundle.
      PUBLIC_GA_FOUR: ${{ vars.NEXT_PUBLIC_GA_FOUR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn remaster:build
      - run: node scripts/validate-remaster-dist.js
      - name: Keep the build for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: remaster-dist
          path: remaster/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - run: yarn remaster:type-check
      - run: yarn remaster:test
      # The remaster pins its own Playwright; `yarn --cwd remaster playwright`
      # resolves the root app's older one and installs the wrong browsers.
      - run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
        working-directory: remaster
      - run: yarn remaster:test:e2e
      - name: Upload remaster browser-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remaster-playwright-report
          path: |
            remaster/playwright-report/
            remaster/test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    # Production: ships the remaster job's tested build as soon as it passes.
    # It does not wait for `validate` (the legacy Next.js app's quality and
    # browser tests, which still run and report): the legacy app is not
    # deployed, and its browser install once hung for 20+ minutes and held a
    # release. Rebuilding here would add minutes for nothing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [remaster]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://historicborders.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: remaster-dist
          path: remaster/dist/
      - run: node scripts/validate-remaster-dist.js
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn wrangler deploy --message "main ${GITHUB_SHA::7}"
      - name: Static production smoke test
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://historic-borders.champtoday.workers.dev' }}
        # New assets can take a few seconds to reach every Cloudflare edge.
        run: |
          for attempt in 1 2 3 4; do
            yarn smoke:production && exit 0
            echo "Smoke attempt $attempt failed; retrying in 15 s"
            sleep 15
          done
          exit 1

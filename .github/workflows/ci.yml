name: CI

# Release process (docs/RELEASE.md):
# - Pull requests run the whole gate in parallel: `checks`, `app` (build and
#   unit tests) and one browser-test job per engine. Auto-merge waits for the
#   required checks `checks`, `app` and `browser tests`. Documentation-only
#   pull requests skip the build and the browsers.
# - A push to main ships: build, validate, deploy, smoke test. The tests do
#   not run again for a merged pull request (they just passed on it), so a
#   flaky browser test can never hold a release. A direct push to main that
#   did not come through a pull request still runs every test first.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests cancel superseded runs. Pushes to main never cancel, so a
# deploy that has started always finishes; the next push deploys after it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    # What this run must do. On a pull request: whether anything but
    # documentation changed. On a push: whether the commit came from a merged
    # pull request (already tested) or was pushed directly.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.scope.outputs.app }}
      tested: ${{ steps.scope.outputs.tested }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
            # Anything outside docs/, design/ and Markdown needs the app gate.
            if printf '%s\n' "$files" | grep -qvE '^(docs/|design/)|\.md$'; then
              echo "app=true" >> "$GITHUB_OUTPUT"
            else
              echo "app=false" >> "$GITHUB_OUTPUT"
            fi
            echo "tested=false" >> "$GITHUB_OUTPUT"
          else
            merged=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)] | length')
            echo "app=true" >> "$GITHUB_OUTPUT"
            if [ "$merged" -gt 0 ]; then
              echo "tested=true" >> "$GITHUB_OUTPUT"
            else
              echo "tested=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          cat "$GITHUB_OUTPUT"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Reviewed exceptions. Keep each one narrow, justified, and dated.
          # GHSA-fc5q-39xc-vjpf (picomatch ReDoS, 2026-11): no patched release
          # exists for any version. It is reached only through build/lint
          # tooling (micromatch, typescript-eslint) matching globs written in
          # this repository, never user input. Remove once a fix ships.
          allow-ghsas: GHSA-fc5q-39xc-vjpf

  checks:
    # Formatting and offline validation of every committed data artifact.
    # Required on pull requests; never holds a deploy.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn format:check
      - run: yarn data:validate

  app:
    # The production app (Astro + MapLibre): the build the browser tests and
    # the deploy use, plus type-check and unit tests where they are needed.
    needs: [scope]
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      # Optional Google Analytics ID, baked into the static bundle.
      PUBLIC_GA_FOUR: ${{ vars.NEXT_PUBLIC_GA_FOUR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn dist:validate
      - run: yarn cloudflare:check
      - run: yarn size:check
      - name: Keep the build for the browser tests and the deploy
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # Cheap guard against a semantic conflict between two merged PRs.
      - run: yarn type-check
      # App, data-script and Worker unit tests (vitest.config.ts projects).
      - if: needs.scope.outputs.tested != 'true'
        run: yarn test

  e2e:
    # Browser journeys against the app job's build, one job per engine so
    # they run side by side, inside Microsoft's Playwright image: browsers
    # and their system packages are preinstalled (`playwright install
    # --with-deps` hung for 8-30 minutes three times on 2026-11-18). The image
    # tag must match @playwright/test in package.json.
    name: e2e (${{ matrix.browser }})
    needs: [scope, app]
    if: needs.app.result == 'success' && needs.scope.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: yarn test:e2e --project=${{ matrix.browser }}
      - name: Upload browser-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  browser-tests:
    # The one required browser check: it passes when every engine passed or
    # the journeys were not needed (documentation, an already-tested merge),
    # so branch protection never waits for a matrix job that did not run.
    name: browser tests
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "e2e: ${{ needs.e2e.result }}"
          case "${{ needs.e2e.result }}" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac

  deploy:
    # Production: ships the app job's build as soon as it (and, for a direct
    # push, the browser journeys) pass. `checks` and the layout suites never
    # hold a release.
    needs: [app, browser-tests]
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.app.result == 'success' && needs.browser-tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://historicborders.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: yarn dist:validate
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn wrangler deploy --message "main ${GITHUB_SHA::7}"
      - name: Static production smoke test
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://historic-borders.champtoday.workers.dev' }}
        # New assets can take a few seconds to reach every Cloudflare edge.
        run: |
          for attempt in 1 2 3 4; do
            yarn smoke:production && exit 0
            echo "Smoke attempt $attempt failed; retrying in 15 s"
            sleep 15
          done
          exit 1

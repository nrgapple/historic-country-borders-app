name = "historic-borders"
main = "worker/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = true

[assets]
directory = "./out"
run_worker_first = ["/api/feedback"]
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[[durable_objects.bindings]]
name = "FEEDBACK_RATE_LIMITER"
class_name = "FeedbackRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FeedbackRateLimiter"]
